<div id="RemoteAccessDashboardPage" data-role="page"
     class="page type-interior pluginConfigurationPage withTabs"
     data-require="emby-button"
     data-controller="__plugin/remoteaccess_dashboard.js">
    <div data-role="content">
        <div class="content-primary">
            <form id="RemoteAccessDashboardForm">
                <div class="verticalSection verticalSection-extrabottompadding">

                    <div class="sectionTitleContainer flex align-items-center">
                        <h1 class="sectionTitle">Dashboard</h1>
                    </div>

                    <!-- Share Your Server -->
                    <!-- The public address as a QR code, shown once Remote Access has one. -->
                    <div id="shareHost" class="hidden"></div>
                    <div id="shareBody" class="hidden">
                        <div id="shareNote" class="fieldDescription">Scan the code with a phone, or send the address to family for their Jellyfin app.</div>
                        <div id="shareHomeOnly" class="base-warn hidden">This address only works on your home network. Pick a public one in step 2 of <a class="ra-link" href="#/configurationpage?name=remoteaccess_configuration">Configuration</a> to share it outside.</div>
                        <div id="shareQr"></div>
                        <div class="base-button-row">
                            <button is="emby-button" type="button" id="btnShare" class="raised base-button secondary small hidden"><span class="material-icons" aria-hidden="true">share</span><span>Share</span></button>
                        </div>
                    </div>

                    <div id="peopleOff" class="base-info hidden"></div>

                    <!-- Locations -->
                    <!-- Where visitors came from, as a world map and a table that share one selection. -->
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">Locations</h2>
                    </div>
                    <div id="worldMap"></div>
                    <div id="countryTable" class="ra-table"></div>

                    <!-- Banned -->
                    <!-- Addresses banned for failed sign-ins, each with a way to lift the ban. -->
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">Banned</h2>
                    </div>
                    <div id="banned" class="ra-table"></div>

                    <!-- Activity -->
                    <!-- What each address did, newest first, filtered on the server. -->
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">Activity</h2>
                    </div>
                    <span id="activityStatus" class="base-status-text" role="status"></span>
                    <div id="activity" class="ra-table"></div>

                    <div class="fieldDescription">
                        <a href="https://db-ip.com" target="_blank" rel="noopener noreferrer" class="button-link">IP geolocation by DB-IP</a>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <link rel="stylesheet" href="configurationpage?name=remoteaccess_jpkribs_shared.css">
    <link rel="stylesheet" href="configurationpage?name=remoteaccess_common.css">
</div>
