overview: "Reach your server from anywhere: Dynamic DNS and a secure HTTPS proxy, inside Jellyfin."
description: >
  Keeps your DNS records pointed at your Jellyfin server's current public IP, and can put a secure HTTPS proxy
  in front of Jellyfin with automatic Let's Encrypt certificates, bans for failed sign-ins, a block list,
  country rules and a history of who connects. Everything runs inside Jellyfin, with no separate reverse proxy
  or updater to run. Remote Access is being actively tested.
