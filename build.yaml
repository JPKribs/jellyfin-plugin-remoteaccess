changelog:
  added:
  - A failed sign-in is recorded with the username that was tried, even when no such user exists, such as a guess at "admin". Jellyfin only reports the name for users that exist. The Dashboard shows it in the User column.
  changed:
  - Jellyfin's API reference under /api-docs is no longer reachable from the internet. It still opens on your own network.
  - On Linux and macOS the proxy only offers AES-GCM and ChaCha20-Poly1305 ciphers. The older CBC ciphers are no longer accepted.
  - Jellyfin's X-Response-Time-Ms header is no longer passed on to clients.
  fixed:
  - Two failed sign-ins from one address moments apart, one for a real user and one for a made-up name, are no longer recorded as two failures for the real user.
