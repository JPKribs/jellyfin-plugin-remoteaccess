changelog:
  changed:
  - Activity log entries share one shape, a short name over one sentence, and repeated events are summed into one entry per outcome. DNS record updates, failures, recoveries and pauses are summed per update run, records added, changed or removed per save, bans past five a minute by country, and left-over Let's Encrypt TXT records per cleanup. Bans, credential changes and other single events keep their own entries, with shorter names such as "203.0.113.7 Banned" and "Certificate Renewed".
