name: '🧪 Test Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/test.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce # master
    with:
      dotnet-version: 10.0.x

  # The page module tests load Base's bundle from the restored package, so restore first.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - run: dotnet restore Jellyfin.Plugin.RemoteAccess/Jellyfin.Plugin.RemoteAccess.csproj
      - run: node --import ./Jellyfin.Plugin.RemoteAccess.Tests/js/register.mjs --test 'Jellyfin.Plugin.RemoteAccess.Tests/js/*.test.mjs'
