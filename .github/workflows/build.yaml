name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/docs/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/docs/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce # master
    with:
      dotnet-version: 10.0.x
      dotnet-target: net10.0

  # Releases are zipped by build.sh (via the changelog workflow), not by the JPRM build above, so CI
  # must exercise that same script or a green build proves nothing about the artifact users install.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Package with build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify package contents
        run: |
          set -euo pipefail
          ZIP=$(ls dist/jellyfin-plugin-remoteaccess-*.zip)
          unzip -l "$ZIP"
          unzip -l "$ZIP" | grep -q 'Jellyfin.Plugin.RemoteAccess.dll'
          unzip -l "$ZIP" | grep -q 'meta.json'

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jellyfin-plugin-remoteaccess-package
          path: dist/*.zip
          retention-days: 14
