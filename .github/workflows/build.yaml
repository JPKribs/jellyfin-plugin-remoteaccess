name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
      - unstable
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/docs/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches:
      - master
      - unstable
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/docs/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@5f6990aa467ae0a6b62c91ad0502e3e1a53117ce # master
    with:
      dotnet-version: 10.0.x
      dotnet-target: net10.0

  # Releases are zipped by build.sh (via the changelog workflow), not by the JPRM build above, so CI
  # must exercise that same script or a green build proves nothing about the artifact users install.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Package with build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify package contents
        run: |
          set -euo pipefail
          ZIP=$(ls dist/jellyfin-plugin-remoteaccess-*.zip)
          unzip -l "$ZIP"
          unzip -l "$ZIP" | grep -q 'Jellyfin.Plugin.RemoteAccess.dll'
          unzip -l "$ZIP" | grep -q 'meta.json'

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jellyfin-plugin-remoteaccess-package
          path: dist/*.zip
          retention-days: 14
